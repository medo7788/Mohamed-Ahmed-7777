name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]


permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17



      - name: Generate debug keystore
        run: |

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"



      # تثبيت Gradle الرسمي المستخدم للإصلاح
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          validate-wrapper: false



      # فحص وإصلاح Gradle Wrapper
      - name: Repair Gradle Wrapper Automatically
        run: |

          GRADLE_VERSION="9.3.1"

          echo "Checking Gradle Wrapper..."

          mkdir -p gradle/wrapper


          NEED_REPAIR=false


          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then

              echo "gradle-wrapper.jar missing"

              NEED_REPAIR=true

          fi



          if [ -f ./gradlew ]; then

              chmod +x ./gradlew || true


              if ! ./gradlew --version >/dev/null 2>&1; then

                  echo "Gradle Wrapper validation failed"

                  NEED_REPAIR=true

              fi

          else

              echo "gradlew missing"

              NEED_REPAIR=true

          fi




          if [ "$NEED_REPAIR" = true ]; then

              echo "Generating official Gradle Wrapper ${GRADLE_VERSION}"


              gradle wrapper \
              --gradle-version ${GRADLE_VERSION}



              echo "Wrapper repaired successfully"


          else

              echo "Wrapper is healthy"

          fi



          echo "Wrapper files:"
          ls -lh gradle/wrapper/



      # حفظ الإصلاح داخل GitHub
      - name: Commit Wrapper Repair
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add gradle/wrapper gradlew gradlew.bat || true


          git commit \
          -m "Auto repair Gradle Wrapper for AGP 9.1.1" \
          || echo "No changes"


          git push \
          || echo "Nothing to push"




      - name: Make gradlew executable
        run: |

          chmod +x ./gradlew || true




      # بناء التطبيق
      - name: Build Debug APK
        run: |

          ./gradlew assembleDebug \
          --stacktrace \
          --no-daemon




      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: ClevCalc-Pro-debug-apk

          path: app/build/outputs/apk/debug/*.apk
