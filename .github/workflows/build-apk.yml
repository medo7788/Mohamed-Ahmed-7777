name: Build Android APK

on:
  workflow_dispatch:      # يديك زرار تشغيل يدوي من تبويب Actions
  push:
    branches: [ main ]    # وبيشتغل تلقائي مع أي push على main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # مشروعك بيدور على debug.keystore في جذر المشروع (مُستبعد من Git عمداً)
      # فبنولّده هنا وقت البناء بنفس القيم اللي متوقعة في build.gradle.kts
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # بما إن gradlew مش موجود، بنسيب أكشن جوجل الرسمي يثبت Gradle مباشرة
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClevCalc-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
