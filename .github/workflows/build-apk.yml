name: Build Android APK

on:
  workflow_dispatch:      # زر تشغيل يدوي من تبويب Actions
  push:
    branches: [ main ]    # يشتغل تلقائي مع أي push على main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # توليد debug keystore لأن المشروع يتوقعه في جذر المشروع
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # تثبيت Gradle عبر أكشن Gradle مع تعطيل فحص wrapper لمنع الفشل الحالي
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrapper: false

      # تأكد أن gradlew قابل للتنفيذ إذا موجود، ثم بنِّي باستخدامه (أو استخدم gradle المثبت)
      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then
            git update-index --chmod=+x gradlew || true
            chmod +x ./gradlew || true
          fi

      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then
            echo "Using project wrapper ./gradlew"
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "Using system gradle"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClevCalc-Pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
